development:
  clients:
    default:
      uri: <%= ENV.fetch("MONGODB_URI", "mongodb://localhost:27017/wait_in_line_development?directConnection=true") %>
  options:
    raise_not_found_error: true

test:
  clients:
    default:
      uri: <%= ENV.fetch("MONGODB_TEST_URI", "mongodb://localhost:27017/wait_in_line_test?directConnection=true") %>
      options:
        read:
          mode: :primary
        max_pool_size: 1
  options:
    raise_not_found_error: true
