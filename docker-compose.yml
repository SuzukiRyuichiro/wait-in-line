services:
  mongo:
    image: mongo:9.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Doubles as the replica-set initializer:
      #   - if rs is already initiated → rs.status() works → healthy
      #   - if not → rs.initiate() → next check passes
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s


  mailpit:
      image: axllent/mailpit:v1.33
      ports:
        - "8025:8025"              # web inbox  → http://localhost:8025
        - "1025:1025"              # SMTP       (host-run Rails can send too)

  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/rails:z
    environment: &app_env
      MONGODB_URI: mongodb://mongo:27017/wait_in_line_development?replicaSet=rs0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      APP_HOST: localhost:3000            # used for links in emails
      NO_SHOW_GRACE_SECONDS: "60"
      SERVICE_SECONDS_PER_PERSON: "3"
    depends_on:
      mongo:
        condition: service_healthy        # wait for the replica set, not just the process
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  scheduler:
    build: .
    command: ["bin/rails", "waitlist:tick_forever"]
    volumes:
      - .:/rails:z
    environment: *app_env
    depends_on:
      mongo:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  e2e:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: ["e2e"]
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
    environment:
      BASE_URL: http://web:3000
      MAILPIT_URL: http://mailpit:8025
      CI: "1"
    depends_on:
      web:
        condition: service_healthy
    command: ["sh", "-c", "npm ci && npx playwright test"]


volumes:
  mongo-data:
